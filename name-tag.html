<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名札作成｜itowa（サン・ライフ様 仕様モック）</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/biz.css" rel="stylesheet">
<link href="assets/font.css" rel="stylesheet">
<link href="assets/fuda.css" rel="stylesheet">
</head>
<body>
<div class="shell">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <span class="title">名札作成</span>
      <span class="spacer"></span>
      <span class="small muted">サンシーガル厚木本部</span>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="modal"></div>

<script src="assets/vendor/html2canvas.min.js"></script>
<script src="assets/vendor/jspdf.umd.min.js"></script>
<script src="assets/fuda.js"></script>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/csv.js"></script>
<script src="assets/pdf.js"></script>
<script>
NAV.mount('nametag');
const $=s=>document.querySelector(s), esc=FUDA.esc;

/* ============================================================
   作業データ（モックなのでメモリ上だけ。画面を閉じると消えます）
   ============================================================ */
let LIST=DATA.ORDERS.map(o=>({
  id:o.id, no:o.no, funeralId:o.funeralId, itemId:o.itemId, qty:o.qty,
  route:o.routeLabel, status:'fixed', note:'',
  label:Object.assign({adj:{},perRow:0},JSON.parse(JSON.stringify(o.label)))
}));
let seq=0;
const S={view:'list', editId:null, sel:new Set(), tune:true,
         fFun:'', fFmt:'', fSt:'', fQ:''};

/* ---------- よく使う名義・肩書（現行システムのワンタップ候補） ---------- */
const QUICK      =['子供一同','孫一同','親族一同','兄弟一同','姉妹一同','友人一同','家一同'];
const CORP_QUICK =['有志一同','社員一同','従業員一同','部一同','一同'];
const TITLE_QUICK=['代表取締役社長','代表取締役','会長','社長','専務取締役','常務取締役','取締役','執行役員','代表','店長','理事長','院長'];
const CORP_TYPES =['（記載なし）','株式会社','有限会社','合同会社','合資会社','合名会社','一般社団法人','医療法人'];
const LEADS      =['','孫','子','兄弟','姉妹','親族','友人','喪主'];
const MAX_NAMES=12, MAX_CORPS=2;

/* ---------- 外字（旧字・異体字）---------- */
const GAIJI=['髙','﨑','嵜','栁','德','濵','濱','邉','邊','齋','齊','𠮷'];
const GAIJI_TREE={
 '高':[{c:'高',mj:'MJ028903',n:'標準字体'},{c:'髙',mj:'MJ028927',n:'はしごだか'},
       {c:'',mj:'MJ028931',n:'口の下が長い形'}],
 '崎':[{c:'崎',mj:'MJ008967',n:'標準字体'},{c:'﨑',mj:'MJ008969',n:'たつさき'},
       {c:'嵜',mj:'MJ008971',n:'山が上'},{c:'',mj:'MJ008973',n:'大が立の形'}],
 '辺':[{c:'辺',mj:'MJ025760',n:'標準字体'},{c:'邊',mj:'MJ039469',n:'旧字'},
       {c:'邉',mj:'MJ039472',n:'旧字（異体）'},{c:'',mj:'MJ039475',n:'鼻の下が方'}],
 '柳':[{c:'柳',mj:'MJ014806',n:'標準字体'},{c:'栁',mj:'MJ014809',n:'卯が異体'},
       {c:'桺',mj:'MJ014811',n:'木へん異体'}],
 '徳':[{c:'徳',mj:'MJ011176',n:'標準字体'},{c:'德',mj:'MJ011179',n:'旧字（心の上に一）'}],
 '浜':[{c:'浜',mj:'MJ016885',n:'標準字体'},{c:'濱',mj:'MJ016889',n:'旧字'},
       {c:'濵',mj:'MJ016891',n:'旧字（異体）'}],
 '斉':[{c:'斉',mj:'MJ010045',n:'標準字体'},{c:'齊',mj:'MJ061105',n:'旧字'},
       {c:'齋',mj:'MJ061107',n:'いつきのさい'},{c:'斎',mj:'MJ010047',n:'常用字体'}],
 '吉':[{c:'吉',mj:'MJ006177',n:'標準字体'},{c:'𠮷',mj:'MJ006180',n:'つちよし'}],
};

/* ---------- 微調整できるフィールド ---------- */
const ADJF=[['na','個人名','名'],['cn','名前（法人）','名'],['co','会社・団体名','社'],
            ['ti','肩書','職'],['rel','続柄（小）','柄'],['lead','頭の語','頭']];
const ADJ_T={na:'name',cn:'cname',co:'org',ti:'title',lead:'lead'};

/* ============================================================
   共通の小道具
   ============================================================ */
const rec=()=>LIST.find(r=>r.id===S.editId);
const fun=id=>DATA.FUNERALS.find(f=>f.id===id);
function filled(r){ const L=r.label;
  return L.kind==='ind' ? (L.names||[]).some(n=>(n.na||'').trim())
                        : (L.corps||[]).some(p=>(p.co||p.na||'').trim()); }
function rows(){
  const q=(S.fQ||'').trim();
  return LIST.filter(r=>(!S.fFun||r.funeralId===S.fFun)&&(!S.fFmt||r.label.fmt===S.fFmt)
    &&(!S.fSt||r.status===S.fSt)&&(!q||FUDA.summary(r.label).includes(q)));
}
function fieldMM(L){
  const g=FUDA.geom(L), out={};
  (g.sp||[]).forEach(x=>{
    if(x.t==='name'){ out.na=g.K*x.k; if(x.relW) out.rel=g.K*x.relW; }
    else if(x.t==='cname') out.cn=g.K*x.k;
    else if(x.t==='org')   out.co=g.K*x.k;
    else if(x.t==='title') out.ti=g.K*x.k;
    else if(x.t==='lead')  out.lead=g.K*x.k;
  });
  return out;
}
function gaijiIn(L){
  const t=[];
  (L.names||[]).forEach(n=>t.push(n.na,n.rel));
  (L.corps||[]).forEach(p=>t.push(p.co,p.ti,p.na));
  t.push(L.lead);
  const hit=[...new Set(t.join('').split('').filter(c=>GAIJI.includes(c)))];
  return hit;
}
/* 値を onclick に安全に埋める */
const arg=v=>JSON.stringify(v).replace(/"/g,'&quot;');
const chipRow=(opts,now,fn)=>`<div class="chips">`+opts.map(([v,l])=>
  `<button type="button" class="chip${now===v?' on':''}" onclick="${fn}(${arg(v)})">${esc(l)}</button>`).join('')+`</div>`;

function go(v,o){ if(o)Object.assign(S,o); S.view=v; render(); window.scrollTo(0,0); }
function render(){
  $('#content').innerHTML = S.view==='import' ? viewImport() : viewMain();
}

/* ============================================================
   本画面　左に一覧／選んだ名札が右に立ち上がる
   ============================================================ */
function viewMain(){
  const list=rows();
  const nFix=LIST.filter(r=>r.status==='fixed').length;
  const ng=LIST.filter(r=>FUDA.verdict(FUDA.geom(r.label))[0]==='warn').length;

  return `<div class="crumb"><a href="orders.html">注文管理</a> ／ 名札作成</div>
  <div class="page-h"><h1>名札作成</h1></div>
  <p class="page-lead">葬家を選んで、名札を1枚ずつ組みます。札ごとの微調整もここで行います。</p>

  <div class="alert alert-info"><b>このモックについて</b>　寸法と組み方は、ヒアリングシートのご回答と
   名札パターン表70種の実測から起こしています。一覧の名札は、そのパターン表70種をそのまま入れたものです。
   保存はされません。</div>

  <div class="card2">
    <div class="row">
      <div style="min-width:190px"><label class="fl">葬家</label>
        <select class="custom-select" onchange="S.fFun=this.value;render()">${sel(
          DATA.FUNERALS.map(f=>[f.id,f.name+'（'+f.hall+'）']),S.fFun,'すべての葬家')}</select></div>
      <div style="min-width:155px"><label class="fl">札の種類</label>
        <select class="custom-select" onchange="S.fFmt=this.value;render()">${sel(
          Object.values(FUDA.FORMATS).map(f=>[f.key,f.name+'　'+f.call]),S.fFmt,'すべての札')}</select></div>
      <div style="min-width:125px"><label class="fl">状態</label>
        <select class="custom-select" onchange="S.fSt=this.value;render()">${sel(
          [['fixed','確定'],['draft','下書き']],S.fSt,'すべての状態')}</select></div>
      <div style="flex:1 1 180px"><label class="fl">名義で探す</label>
        <input class="form-control" type="text" id="fQ" value="${esc(S.fQ)}" placeholder="平塚、株式会社 など"
          oninput="S.fQ=this.value;listOnly()"></div>
      <div><label class="fl">&nbsp;</label>
        <button class="btn" onclick="addNew()"><i class="fas fa-plus"></i> 個別に作成</button></div>
      <div><label class="fl">&nbsp;</label>
        <button class="btn" onclick="go('import',{imStep:1})"><i class="fas fa-file-csv"></i> 一括取り込み</button></div>
    </div>
    <div class="row" style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px;align-items:center">
      <button class="btn btn-sm" onclick="selAll(true)">表示中をすべて選択</button>
      <button class="btn btn-sm" onclick="selAll(false)">選択を解除</button>
      <span class="small muted" id="selInfo">${selText()}</span>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="pdfBtn" ${S.sel.size?'':'disabled'} onclick="doPdf()">
        <i class="fas fa-file-pdf"></i> 選択した名札をPDFで出力</button>
    </div>
    <p class="help" style="margin-top:8px">PDFは<b>札の種類ごとに分かれて</b>出ます（生花札／芳名札／スロープ・枕札）。
      ページの大きさは札の実寸です。背景は塗らず、黒のインクだけを載せています。</p>
    <div id="pdfLog"></div>
  </div>

  <div class="grid2 wide">
    <div>
      <div class="lst" id="lst">${listRows(list)}</div>
      <p class="small muted" style="margin-top:10px" id="cnt">${list.length} 件を表示（全 ${LIST.length} 件）
        　／　確定 ${nFix}　下書き ${LIST.length-nFix}　要確認 ${ng}</p>
    </div>
    <aside id="side">${asideHtml()}</aside>
  </div>`;
}

function listRows(list){
  if(!list.length) return `<div class="empty">条件に合う名札がありません</div>`;
  return list.map(r=>{
    const f=fun(r.funeralId), fm=FUDA.FORMATS[r.label.fmt];
    const [vk,vm]=FUDA.verdict(FUDA.geom(r.label));
    const nAdj=ADJF.filter(([k])=>r.label.adj&&r.label.adj[k]).length;
    return `<div class="lrow ${S.editId===r.id?'on':''}" onclick="pick('${r.id}')">
      <div onclick="event.stopPropagation()"><input type="checkbox" ${S.sel.has(r.id)?'checked':''}
        onchange="toggleSel('${r.id}')"></div>
      <div class="no">${r.no?('#'+String(r.no).padStart(3,'0')):'新規'}</div>
      <div>
        <div class="nm">${filled(r)?esc(FUDA.summary(r.label)):'<span class="muted">未入力</span>'}</div>
        <div class="mt">${f?esc(f.name):''}　${fm?esc(fm.name):'—'}　${esc(DATA.ITEM(r.itemId).name)}${
          r.qty>1?' ×'+r.qty:''}${nAdj?`　<span style="color:var(--primary)">微調整${nAdj}件</span>`:''}</div>
      </div>
      <div>${r.status==='fixed'?'<span class="badge b-success">確定</span>'
                              :'<span class="badge b-warning">下書き</span>'}</div>
      <div><span class="fv ${vk}">${esc(vm)}</span></div>
    </div>`;}).join('');
}
function drawList(){
  const e=$('#lst'); if(e) e.innerHTML=listRows(rows());
  const c=$('#cnt'); if(c){ const n=rows().length, nFix=LIST.filter(r=>r.status==='fixed').length,
    ng=LIST.filter(r=>FUDA.verdict(FUDA.geom(r.label))[0]==='warn').length;
    c.textContent=`${n} 件を表示（全 ${LIST.length} 件）　／　確定 ${nFix}　下書き ${LIST.length-nFix}　要確認 ${ng}`; }
}
function pick(id){ S.editId=id; drawList(); const a=$('#side'); if(a) a.innerHTML=asideHtml(); }
function sel(opts,now,all){
  return `<option value="">${all}</option>`+opts.map(([v,l])=>
    `<option value="${esc(v)}" ${now===v?'selected':''}>${esc(l)}</option>`).join('');
}
function selText(){
  const ch=LIST.filter(r=>S.sel.has(r.id)); if(!ch.length) return 'チェックで名札を選んでください。';
  const by={}; ch.forEach(r=>{const f=FUDA.FORMATS[r.label.fmt]; if(f) by[f.name]=(by[f.name]||0)+r.qty;});
  const p=Object.entries(by).map(([k,v])=>`${k} ${v}枚`);
  return `選択 ${ch.length} 件　／　${p.join('　')}　→　PDF ${p.length}ファイル`;
}
function listOnly(){ drawList(); }
function toggleSel(id){ S.sel.has(id)?S.sel.delete(id):S.sel.add(id);
  const i=$('#selInfo'); if(i)i.textContent=selText();
  const b=$('#pdfBtn'); if(b)b.disabled=!S.sel.size; }
function selAll(on){ rows().forEach(r=>on?S.sel.add(r.id):S.sel.delete(r.id));
  drawList(); const i=$('#selInfo'); if(i)i.textContent=selText();
  const b=$('#pdfBtn'); if(b)b.disabled=!S.sel.size; }

/* 一覧と右側だけを描きなおす（ページ全体は作りなおさない） */
function redraw(){ drawList(); const a=$('#side'); if(a) a.innerHTML=asideHtml(); }
function editLabel(id){ pick(id); }
function dupLabel(id){
  const src=LIST.find(r=>r.id===id); seq++;
  const r=Object.assign({},src,{id:'NEW'+seq,no:0,status:'draft',
    label:JSON.parse(JSON.stringify(src.label))});
  LIST.unshift(r); S.editId=r.id;
  if(S.view!=='list'){ go('list'); } else { redraw(); scrollSide(); }
}
function addNew(){
  seq++;
  const r={id:'NEW'+seq,no:0,funeralId:S.fFun||DATA.FUNERALS[0].id,itemId:'I1',qty:1,
    route:'手入力',status:'draft',note:'',
    label:{fmt:S.fFmt||'seika',adj:{},kind:'ind',lead:'',withRel:false,perRow:0,
           names:[{na:'',rel:'',couple:false}],
           corps:[{type:'株式会社',co:'',ti:'代表取締役',na:''}]}};
  LIST.unshift(r); S.editId=r.id;
  if(S.view!=='list'){ go('list'); } else { redraw(); scrollSide(); }
  const e=$('#na0'); if(e) e.focus();
}
function scrollSide(){ const a=$('#side'); if(a) a.scrollIntoView({block:'start',behavior:'smooth'}); }

/* ============================================================
   一括取り込み（札種ごとのCSV）
   ============================================================ */
const IM={step:1, fmt:'seika', rows:[], cand:[], pick:0, fileName:''};

function viewImport(){
  const steps=['テンプレート','読み込み','自動で割り当て','1件ずつ確認','名札リストへ追加'];
  const head=`<div class="crumb"><a href="orders.html">注文管理</a> ／
    <a href="#" onclick="go('list');return false">名札作成</a> ／ 一括取り込み</div>
  <h1 class="page">一括取り込み</h1>
  <div class="stepper">${steps.map((t,i)=>`<div class="st ${IM.step===i+1?'on':''} ${IM.step>i+1?'done':''}">
    <span class="n">${IM.step>i+1?'✓':i+1}</span>${t}</div>`).join('')}</div>`;

  if(IM.step===1) return head+`
  <div class="card"><div class="card-header">1. 札の種類ごとにテンプレートCSVを取る</div>
    <div class="card-body">
      <p class="small muted" style="margin-top:0">札の種類ごとに<b>入る名義の数が違う</b>ため、
        テンプレートも札種ごとに分けています。Excelでそのまま開けるよう、BOM付きのUTF-8で出します。</p>
      <div class="flist">${Object.values(FUDA.FORMATS).map(F=>`<div class="frowx">
        <div class="fn mono">名札テンプレート_${esc(F.name)}.csv</div>
        <span class="badge b-primary">${F.W}×${F.H}mm</span>
        <span class="small muted nowrap">連名 ${maxNamesOf(F.key)} 名まで</span>
        <button class="btn btn-outline btn-sm" onclick="dlTemplate('${F.key}')">ダウンロード</button>
      </div>`).join('')}</div>
      <div class="alert alert-info" style="margin:14px 0 0">
        <b>列は1行＝1名義です。</b>同じ「注文番号」の行をまとめて1枚の名札にします。
        連名12名なら12行です。横に広がらないので、Excelで扱いやすくなります。<br>
        会社種別・会社名・肩書・氏名を分けて書けない場合は、
        <b>「名義（自由入力）」の1列だけ</b>でも構いません。読み込むときに自動で分けます。</div>
    </div>
    <div class="card-footer"><button class="btn btn-outline" onclick="go('list')">戻る</button>
      <span class="spacer"></span>
      <button class="btn btn-primary" onclick="IM.step=2;render()">次へ</button></div></div>`;

  if(IM.step===2) return head+`
  <div class="card"><div class="card-header">2. 記入済みのCSVを読み込む</div>
    <div class="card-body">
      <div class="fld" style="max-width:280px"><label>この取り込みの札の種類</label>
        <select class="custom-select" onchange="IM.fmt=this.value">${
          Object.values(FUDA.FORMATS).map(F=>`<option value="${F.key}" ${IM.fmt===F.key?'selected':''}
            >${esc(F.name)}　${F.call}</option>`).join('')}</select>
        <div class="help">CSVに「商品」が書いてあれば、そちらが優先されます。</div></div>
      <div class="drop" id="drop">
        ここにCSVファイルをドロップ<br><span class="small">または</span><br>
        <input type="file" accept=".csv,text/csv" id="csvFile" style="display:none" onchange="onFile(this)">
        <button class="btn btn-primary btn-sm" style="margin-top:8px"
          onclick="document.getElementById('csvFile').click()">ファイルを選択</button>
        <button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="demoCsv()">サンプルで試す</button>
        <div class="small" style="margin-top:9px">UTF-8・Shift_JIS を自動で見分けます</div>
      </div>
      <div id="imErr"></div>
    </div>
    <div class="card-footer"><button class="btn btn-outline" onclick="IM.step=1;render()">戻る</button></div></div>`;

  if(IM.step===3){
    const low=IM.cand.filter(c=>c.conf<0.8||c.warnings.length).length;
    return head+`
    <div class="card"><div class="card-header">3. 自動で割り当てた結果
      <span class="spacer"></span>
      <span class="small muted">${esc(IM.fileName)}　${IM.cand.length} 枚</span></div>
      <div class="card-body">
        <p class="small muted" style="margin-top:0">お客様から受け取るデータは、itowa の様式とは限りません。
          1つのセルに社名・肩書・氏名が混ざっていても分解し、個人か法人かも見分けます。
          <b>分け方の規則は、お預かりした名札パターン表70種から起こしています。</b></p>
        ${low?`<div class="alert alert-warn">${low} 枚は確認をおすすめします。下の一覧で先頭に出しています。</div>`
             :`<div class="alert alert-success">すべて確度が高く、上限を超えるものもありません。</div>`}
        <table class="table"><thead><tr>
          <th>注文番号</th><th>区分</th><th>会社・団体名</th><th>肩書</th><th>名義</th>
          <th class="num">枚</th><th>確度</th></tr></thead><tbody>
          ${IM.cand.slice().sort((a,b)=>(a.conf-a.warnings.length)-(b.conf-b.warnings.length))
            .map(c=>{const L=c.label; return `<tr>
            <td class="mono nowrap">${esc(c.key)}</td>
            <td><span class="badge ${L.kind==='corp'?'b-info':'b-secondary'}">${
              L.kind==='corp'?'法人':'個人'}</span></td>
            <td class="small">${L.kind==='corp'?esc(L.corps.map(p=>p.co).filter(Boolean).join(' ／ ')||'—'):'—'}</td>
            <td class="small">${L.kind==='corp'?esc(L.corps.map(p=>p.ti).filter(Boolean).join(' ／ ')||'—'):'—'}</td>
            <td class="small"><b>${esc(FUDA.summary(L))}</b>
              ${c.raw.length?`<div class="small muted">元：${esc(c.raw.join(' / '))}</div>`:''}
              ${c.warnings.map(w=>`<div class="small" style="color:#856404">⚠ ${esc(w)}</div>`).join('')}</td>
            <td class="num">${c.qty}</td>
            <td>${c.conf<0.8?'<span class="badge b-warning">要確認</span>'
                            :'<span class="badge b-success">確度高</span>'}</td></tr>`;}).join('')}
        </tbody></table>
      </div>
      <div class="card-footer"><button class="btn btn-outline" onclick="IM.step=2;render()">戻る</button>
        <span class="spacer"></span>
        <button class="btn btn-primary" onclick="IM.step=4;IM.pick=0;render()">1件ずつ確認へ</button></div></div>`;
  }

  if(IM.step===4){
    const c=IM.cand[IM.pick]||IM.cand[0];
    return head+`
    <div class="alert alert-warn">この状態は<b>下書き</b>です。確定するまで出力の対象になりません。</div>
    <div class="split"><div class="l">
      <div class="card"><div class="card-header">4. 1件ずつ見る

function maxNamesOf(k){ return k==='seika'?MAX_NAMES:(k==='houmei'?8:6); }
function dlTemplate(k){
  FUDACSV.download('名札テンプレート_'+FUDA.FORMATS[k].name+'.csv',
    FUDACSV.template(k,FUDA.FORMATS,maxNamesOf(k)));
}
async function onFile(el){
  const f=el.files&&el.files[0]; if(!f) return;
  try{ const t=await FUDACSV.readFile(f); loadCsv(t,f.name); }
  catch(e){ $('#imErr').innerHTML=`<div class="alert alert-danger" style="margin-top:12px">${esc(e.message||e)}</div>`; }
}
function demoCsv(){ loadCsv(FUDACSV.template(IM.fmt,FUDA.FORMATS,maxNamesOf(IM.fmt)),'（サンプル）'); }
function loadCsv(text,name){
  try{
    const rows=FUDACSV.parse(text);
    IM.cand=FUDACSV.toLabels(rows,{FUNERALS:DATA.FUNERALS,ITEMS:DATA.ITEMS,
      MAX_NAMES:maxNamesOf(IM.fmt),MAX_CORPS:MAX_CORPS,fmt:IM.fmt});
    if(!IM.cand.length) throw new Error('読み取れる行がありませんでした。');
    IM.fileName=name; IM.step=3; render();
  }catch(e){
    $('#imErr').innerHTML=`<div class="alert alert-danger" style="margin-top:12px">${esc(e.message||e)}</div>`;
  }
}
function commitImport(){
  IM.cand.forEach(c=>{ seq++;
    LIST.unshift({id:'CSV'+seq,no:0,funeralId:c.funeralId,itemId:c.itemId,qty:c.qty,
      route:'CSV',status:'draft',note:c.note,label:c.label}); });
  const n=IM.cand.length; IM.cand=[]; IM.step=1;
  go('list'); flash(n+' 枚を下書きとして追加しました。1枚ずつ開いて確定してください。','alert-success');
}

        : `<span class="help" style="margin-left:auto">上限 ${MAX_NAMES} 名</span>`}</div>`;

    h+=`<div class="fld"><label>1段あたりの人数（この札だけ）</label>

/* ---------- 右の数値 ---------- */
function metricsHtml(L){
  const g=FUDA.geom(L), [vk,vm]=FUDA.verdict(g);
  if(g.empty) return `<div style="text-align:center"><span class="fv ${vk}">${esc(vm)}</span></div>`;
  return `<div style="text-align:center;margin-bottom:9px"><span class="fv ${vk}">${esc(vm)}</span></div>
  <table class="table" style="font-size:12.5px">
    <tr><th style="width:48%">文字サイズ</th><td class="num">${g.Kmain.toFixed(1)} mm
      <span class="muted">（${FUDA.mm2pt(g.Kmain)} pt）</span></td></tr>
    <tr><th>字送り</th><td class="num">${g.LH.toFixed(2)} 倍</td></tr>
    <tr><th>列数 ／ 段数</th><td class="num">${g.mc} 列 ／ ${g.nR} 段</td></tr>
    <tr><th>最長の列</th><td class="num">${g.maxChars} 字</td></tr>
    <tr><th>縦の占有</th><td class="num">${Math.round(g.usedH/g.bodyH*100)} %</td></tr>
    <tr><th>効いた制約</th><td class="num">${g.bind}</td></tr>
  </table>`;
}

/* ---------- 微調整 ---------- */
function tuneBody(L){
  const sp=FUDA.specsOf(L,FUDA.MEAS), kinds=new Set(sp.map(x=>x.t)), mm=fieldMM(L);
  const hasRel=L.withRel&&sp.some(x=>x.t==='name');
  const alone=kinds.size<=1;
  if(!kinds.size) return `<span class="muted small">名義を入れると、調整できる項目が出ます。</span>`;
  return `<p class="small muted" style="margin-top:0">フィールドごとに ±5 段階、1段階が5%です。
      <b>相対比率</b>方式のため、上げた行は必ず相対的に大きくなり、そのぶん他の行が小さくなります。
      全体はつねに印字領域に収まります。</p>
    ${ADJF.map(([k,lab,kk])=>{
      const v=(L.adj&&L.adj[k])||0;
      const present = k==='rel'?hasRel:kinds.has(ADJ_T[k]);
      const dead = !present || (alone && k!=='rel');
      return `<div class="slrow ${dead?'dead':''}">
        <div class="slh"><span class="kk">${kk}</span><span class="lab">${lab}</span>
          <span class="mm" data-mm="${k}">${(mm[k]||0).toFixed(1)}mm</span>
          <span class="val ${v===0?'z':''}" data-v="${k}">${v>0?'+':''}${v}</span></div>
        <input type="range" min="-5" max="5" step="1" value="${v}" ${dead?'disabled':''}
          oninput="setAdj('${k}',this.value)"></div>`;}).join('')}
    ${alone?`<p class="small" style="color:#856404">この札は列が全部おなじ種類なので、
      個々の大きさを動かしても結果は変わりません。</p>`:''}
    <div class="help">微調整は名札1枚ごとに保存されます。この画面でのみ調整でき、
      注文管理やお客様の画面には出ません。</div>`;
}

/* ============================================================
   操作
   ============================================================ */
function refresh(){                     /* 入力中は組み直さず、表示だけ更新 */
  const r=rec(); if(!r) return; const L=r.label;
  const box=$('#fudabox'); if(box) box.innerHTML=FUDA.html(L,300,{area:true});
  const mt=$('#metrics'); if(mt) mt.innerHTML=metricsHtml(L);
  const pv=$('#pvtext'); if(pv) pv.textContent=FUDA.summary(L)||'—';
  const bd=$('#lbadge'); if(bd){ const ok=filled(r);
    bd.className='badge '+(ok?'b-success':'b-secondary'); bd.textContent=ok?'名札 入力済':'名札 未入力'; }
  const fb=$('#fixBtn'); if(fb) fb.disabled=!filled(r);
  const mm=fieldMM(L);
  document.querySelectorAll('[data-mm]').forEach(e=>{
    e.textContent=(mm[e.dataset.mm]||0).toFixed(1)+'mm';});
}
function touch(){ const r=rec(); if(r&&r.status==='fixed') r.status='draft'; }

function setFun(v){ rec().funeralId=v; touch(); redraw(); }
function setItem(v){ const r=rec(); r.itemId=v;
  const it=DATA.ITEM(v); if(it&&it.fmt) r.label.fmt=it.fmt; touch(); redraw(); }
function setQty(v){ rec().qty=+v; touch(); redraw(); }
function setFmt(v){ rec().label.fmt=v; touch(); redraw(); }
function setKind(v){ const L=rec().label; L.kind=v; L.adj={}; touch(); redraw(); }
function setLead(v){ rec().label.lead=v; touch(); redraw(); }
function setRel(v){ const L=rec().label; L.withRel=v; L.adj={}; touch(); redraw(); }
function setPer(v){ rec().label.perRow=v; touch(); redraw(); }
function setQuick(i,v){ rec().label.names[i].na=v; touch(); redraw(); }
function setCouple(i,v){ const n=rec().label.names[i]; n.couple=v;
  if(v) n.na=(n.na||'').replace(/\s+/g,''); touch(); redraw(); }
function setN(i,k,v){ rec().label.names[i][k]=v; touch(); refresh(); }
function setC(i,k,v,re){ rec().label.corps[i][k]=v; touch(); re?render():refresh(); }
function setNote(v){ rec().note=v; }
function addN(){ const L=rec().label; if(L.names.length>=MAX_NAMES) return;
  L.names.push({na:'',rel:'',couple:false}); touch(); redraw();
  const e=$('#na'+(L.names.length-1)); if(e) e.focus(); }
function rmN(){ const L=rec().label; if(L.names.length>1){L.names.pop(); L.adj={}; touch(); redraw();} }
function addC(){ const L=rec().label; if(L.corps.length>=MAX_CORPS) return;
  L.corps.push({type:'株式会社',co:'',ti:'',na:''}); touch(); redraw(); }
function rmC(){ const L=rec().label; if(L.corps.length>1){L.corps.pop(); L.adj={}; touch(); redraw();} }
function setAdj(k,v){
  const L=rec().label; L.adj=L.adj||{}; L.adj[k]=+v; touch();
  const box=$('#fudabox'); if(box) box.innerHTML=FUDA.html(L,300,{area:true});
  const mt=$('#metrics'); if(mt) mt.innerHTML=metricsHtml(L);
  const mm=fieldMM(L);
  document.querySelectorAll('[data-mm]').forEach(e=>{
    e.textContent=(mm[e.dataset.mm]||0).toFixed(1)+'mm';});
  const el=document.querySelector(`[data-v="${k}"]`);
  if(el){ el.textContent=(+v>0?'+':'')+v; el.className='val'+(+v===0?' z':''); }
}
function resetAdj(){ rec().label.adj={}; touch(); redraw(); }
function saveDraft(){ const r=rec(); r.status='draft'; drawList();
  flash('下書きとして保存しました。（モックなので画面を閉じると消えます）','alert-info'); }
function fixLabel(){ const r=rec(); r.status='fixed';
  flash('確定しました。出力の対象になります。','alert-success'); redraw(); }
function flash(msg,cls){
  const b=document.createElement('div'); b.className='alert '+cls;
  b.style.cssText='position:fixed;right:22px;bottom:22px;z-index:70;box-shadow:0 4px 16px rgba(0,0,0,.18)';
  b.textContent=msg; document.body.appendChild(b); setTimeout(()=>b.remove(),2600);
}

/* ---------- 外字（旧字・異体字）の選択 ---------- */
let GT=null;
function openGaiji(scope,idx,field){
  GT={scope,idx,field};
  const keys=Object.keys(GAIJI_TREE);
  $('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeGaiji()">
    <div class="box">
      <div class="card-header">字が出ないとき<span class="spacer"></span>
        <button class="btn btn-outline btn-sm" onclick="closeGaiji()">閉じる</button></div>
      <div class="card-body" style="padding-bottom:0">
        <p class="small muted" style="margin-top:0">よくある旧字・異体字です。押すと入力欄のうしろに足します。
          実機では MJ文字情報一覧表から字形を探し、見つからない字は外字として画像で差し込みます。</p>
      </div>
      ${keys.map(k=>`<div class="card-body" style="padding:8px 15px 0">
        <div class="cap small muted">「${k}」の仲間</div></div>
        ${GAIJI_TREE[k].map(x=>`<div class="gcand" onclick="pickGaiji(${arg(x.c)})">
          ${x.c?`<div class="gc">${esc(x.c)}</div>`:`<div class="gph">外字<br>画像</div>`}
          <div class="fn"><b>${esc(x.n)}</b><div class="small muted mono">${x.mj}</div></div>
          ${x.c?'<span class="badge b-success">そのまま出ます</span>'
               :'<span class="badge b-warning">外字（画像で差し込み）</span>'}
        </div>`).join('')}`).join('')}
      <div class="card-footer"><span class="small muted">
        選んだ字は入力欄に追加されます。不要な文字は手で消してください。</span></div>
    </div></div>`;
}
function closeGaiji(){ $('#modal').innerHTML=''; GT=null; }
function pickGaiji(ch){
  if(!ch){ flash('この字形は外字です。実機では画像で差し込みます。','alert-warn'); closeGaiji(); return; }
  const L=rec().label;
  if(GT.scope==='n') L.names[GT.idx][GT.field]=(L.names[GT.idx][GT.field]||'')+ch;
  else               L.corps[GT.idx][GT.field]=(L.corps[GT.idx][GT.field]||'')+ch;
  closeGaiji(); touch(); redraw();
}

/* ============================================================
   PDF 出力
   ============================================================ */
async function doPdf(){
  const items=LIST.filter(r=>S.sel.has(r.id)).flatMap(r=>{
    const f=fun(r.funeralId);
    return Array.from({length:r.qty},()=>({label:r.label,title:(f?f.name:'')+'_'+r.id}));
  });
  if(!items.length) return;
  const log=h=>{const e=$('#pdfLog'); if(e)e.innerHTML=h;};
  const b=$('#pdfBtn'); if(b)b.disabled=true;
  log(`<p class="small muted" style="margin-top:10px">作成しています…</p>`);
  try{
    const made=await FUDAPDF.exportByFormat(items,{prefix:'名札',
      onStep:(i,n,nm)=>log(`<p class="small muted" style="margin-top:10px">${nm}　${i} / ${n} 枚目を作成中…</p>`)});
    log(`<div class="alert alert-success" style="margin-top:12px">
      <b>${made.length}ファイルを書き出しました。</b><br>`+
      made.map(m=>`${esc(m.name)}　（${m.size}mm × ${m.count}枚）`).join('<br>')+`</div>`);
  }catch(e){
    log(`<div class="alert alert-danger" style="margin-top:12px">書き出せませんでした。${esc(e.message||e)}</div>`);
  }
  if(b)b.disabled=!S.sel.size;
}

/* 注文管理から #注文番号 で飛んできたとき */
const h0=decodeURIComponent(location.hash.replace(/^#/,''));
if(h0 && LIST.some(r=>r.id===h0)) S.editId=h0;
render();
if(S.editId){ const el=document.querySelector('.lrow.on'); if(el) el.scrollIntoView({block:'center'}); }
</script>
