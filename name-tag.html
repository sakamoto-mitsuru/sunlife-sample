<style>

*{box-sizing:border-box} html,body{margin:0;padding:0}

.sortable{cursor:pointer;user-select:none}.sortable::after{content:" ⇅";color:#adb5bd;font-size:11px}

.pcard{border:1px solid var(--border);border-radius:3px;background:#fff;overflow:hidden;display:flex;flex-direction:column}

.fuda{background:#EDE2CE;border:1px solid #C9B896;display:flex;flex-direction:column;align-items:center;

.pvline{background:#f8f9fa;border:1px solid var(--border);border-radius:3px;padding:7px 10px;font-size:12.5px;margin-top:6px}

.tune{border:1px solid var(--border);border-radius:3px;background:#fff;margin-top:12px}
.tune .th{padding:9px 13px;border-bottom:1px solid var(--border);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:9px}

.slrow{margin-bottom:11px}
.slh{display:flex;align-items:baseline;gap:8px;font-size:12.5px;margin-bottom:2px}

input[type=range]{width:100%;accent-color:var(--primary);margin:0}
.flist{border:1px solid var(--border);border-radius:3px}

<script>

function splitSurname(nm){const g=Array.from(nm);const i=g.findIndex(c=>c===' '||c==='　');

function composeLabel(l){

  const s=[t+c.company.trim(),c.title.trim(),c.name.trim()].filter(Boolean).join(' ');if(s.trim())p.push(s);});
 return p.join('／');}

function labelTexts(l){
 if(l.kind==='individual')return l.names.map(n=>n.name.trim()).filter(Boolean);
 return l.corps.flatMap(c=>[c.company.trim(),c.name.trim()]).filter(Boolean);}
const isExcluded=l=>{const t=labelTexts(l);return t.length>0&&t.every(x=>EXCLUDE.includes(x));};

/* ============ 名札レンダリング（注文管理モックから移植 ＋ 行ごと微調整） ============ */
const LH=1.15;                 /* 既定。実際は各フォーマットの lh を使う */
const GIN=.16, GOUT=.46;       /* 列間（同じ差出人の中／連名どうし） */
const chars=t=>(t||'').replace(/\s/g,'').length;
/* 高さの計算用。空白は半分の高さを取るので 0.5 と数える（描画側と合わせる） */
const ulen=t=>[...(t||'')].reduce((a,c)=>a+(/\s/.test(c)?0.5:1),0);
const W=(l,k)=>1+0.05*(l.adj[k]||0);   /* 行ごとの相対比率 */

function buildSpecs(l){
 const C=fmt(l.formatId).cap;
 const specs=[];
 if(l.kind==='individual'){
  const es=[];
  l.names.forEach((n,i)=>{const nm=(n.name||'').trim();if(!nm)return;
   const r=n.isCouple?[0,'',nm]:splitSurname(nm);
   es.push({i,relation:l.withRelation?(n.relation||'').trim():'',slen:r[0],sur:r[1],giv:r[2]});});
  const ws=es.filter(e=>e.slen>0);
  const maxlen=ws.length?Math.max(...ws.map(e=>e.slen)):0;
  es.forEach(e=>{
   let head=e.sur,tail=e.giv,gap=0;
   if(e.slen>0)gap=0.5+(maxlen-e.slen);
   else if(maxlen>0){head='';gap=maxlen+0.5;}
   /* 比率は「氏名の上限」を1としたときの相対値。上限どうしの比がそのまま初期比率になる。 */
   const rn=1*W(l,'n'+e.i), rr=(C.rel/C.na)*W(l,'r'+e.i);
   const relu=l.withRelation?(e.relation?ulen(e.relation)*rr+0.3:rr+0.3):0;
   specs.push({t:'name',key:'n'+e.i,relation:e.relation,rr,head,gap,tail,rn,
     cap:C.na, capRel:C.rel,
     units:relu+(ulen(head)+gap+ulen(tail))*rn});
  });
 }else{
  l.corps.forEach((c,ci)=>{
   const type=c.type==='（記載なし）'?'':c.type;
   const org=(type+(c.company||'')).trim(), title=(c.title||'').trim(), name=(c.name||'').trim();
   if(!org&&!name)return;
   const ro=(C.co/C.cn)*W(l,'o'+ci), rt=(C.ti/C.cn)*W(l,'t'+ci), rn=1*W(l,'c'+ci);
   if(org)specs.push({t:'org',key:'o'+ci,text:org,ro,cap:C.co,units:ulen(org)*ro});
   if(name||title)specs.push({t:'cname',key:'c'+ci,tkey:'t'+ci,title,name,rt,rn,
     cap:C.cn,capTi:C.ti,units:(title?ulen(title)*rt+0.3:0)+ulen(name)*rn});
  });
 }
 return specs;
}

function fudaGeom(l){
 const M=fmt(l.formatId), C=M.cap, LHx=M.lh, SX=M.sx;
 const hdH=C.hd*chars(M.hd)*1.12;
 const bodyTop=M.top+hdH+M.H*0.025;
 /* 下部の表記がある場合は、その帯を本文領域から除く */
 const ftBand=M.ft?M.H*0.022*1.45:0;
 const bodyH=M.H-bodyTop-M.bottom-ftBand;
 const innerW=M.W-M.side*2;
 const specs=buildSpecs(l);
 let rows;
 if(!specs.length)rows=[];
 else if(l.kind==='individual'&&specs.length>4){const t=Math.ceil(specs.length/2);rows=[specs.slice(0,t),specs.slice(t)];}
 else rows=[specs];
 const numRows=Math.max(1,rows.length);
 const maxUnits=Math.max(1,...specs.map(s=>s.units));
 const maxCols=Math.max(1,...rows.map(r=>r.length));
 const fitH=bodyH*0.94/(numRows*maxUnits*LHx);
 const fitW=innerW/(maxCols*1.35*SX);
 /* 行ごとの上限。ある行が上限に達したら全体をそこで止める。 */
 const capK=Math.min(...specs.map(s=>{
   const w = s.t==='org'?s.ro : s.rn;
   return s.cap/(w||1);
 }),Infinity);
 const NF=Math.max(3,Math.min(fitH,fitW,capK||99));
 const usedH=numRows*maxUnits*NF*LHx+M.H*0.03*(numRows-1);
 const slack=Math.max(0,bodyH-usedH);
 const offset=M.valign==='middle'?slack/2:(M.valign==='optical'?slack*0.38:0);
 return{M,hdMM:C.hd,bodyTop,bodyH,innerW,specs,rows,NF,LH:LHx,SX,usedH,slack,offset,ftBand};
}

function fudaHtml(l,pxH,showArea,bump,opts){
 opts=opts||{};
 const g=fudaGeom(l),M=g.M;
 const MM=opts.unit==='mm';
 const SC=MM?1:pxH/M.H, NF=g.NF*SC, LHx=g.LH, SX=g.SX;
 const U=v=>(v*SC).toFixed(2)+(MM?'mm':'px');
 const PW=MM?M.W+'mm':(M.W*SC)+'px', PH=MM?M.H+'mm':pxH+'px';
 const plain=opts.plain
   ?'background:#fff;background-image:none;border:none;box-shadow:none;'
   :'';
 const area=(showArea&&!opts.plain)?`<div class="fuda-area" style="left:${U(M.side)};top:${U(M.top)};
   width:${U(M.W-M.side*2)};height:${U(M.H-M.top-M.bottom)}"></div>`:'';
 const ft=M.ft?`<div class="fuda-ft" style="bottom:${U(M.bottom+M.H*0.004)};font-size:${U(M.H*0.022)}">${esc(M.ft)}</div>`:'';
 const head=`<div class="fuda-hd" style="margin-top:${U(M.top)};font-size:${U(g.hdMM)};
   writing-mode:vertical-rl;text-orientation:upright;line-height:1.12">${esc(M.hd)}</div>`;
 const shell=inner=>`<div class="fuda" style="${plain}width:${PW};height:${PH}">${area}${head}
   <div class="fuda-body" style="margin-top:${U(M.H*0.025+g.offset)};gap:${U(M.H*0.03)}">${inner}</div>${ft}</div>`;
 if(!g.specs.length)return shell(`<div class="fuda-row"><div class="fuda-col"
   style="color:#a99b84;font-size:${U(M.W*0.07)};font-family:inherit">名義未入力</div></div>`);

 const gl=(t,size)=>Array.from(t||'').map(ch=>(ch===' '||ch==='　')
   ?`<span style="display:block;height:${U(size*0.5/SC)}"></span>`
   :`<span style="display:block;font-size:${U(size/SC)};line-height:${LHx};transform:scaleX(${SX})">${esc(ch)}</span>`).join('');
 const sp=v=>v>0?`<span style="display:block;height:${U(v/SC)}"></span>`:'';

 const col=s=>{
  const on=bump&&bump.has(s.key)?' bump':'';
  if(s.t==='org')return `<div class="fuda-col${on}">${gl(s.text,NF*s.ro)}</div>`;
  if(s.t==='cname'){let inner='';
   if(s.title)inner+=gl(s.title,NF*s.rt)+sp(NF*0.3);
   inner+=gl(s.name,NF*s.rn);
   const on2=bump&&(bump.has(s.key)||bump.has(s.tkey))?' bump':'';
   return `<div class="fuda-col${on2}">${inner}</div>`;}
  let inner='';
  if(l.kind==='individual'&&l.withRelation)
   inner+=s.relation?gl(s.relation,NF*s.rr)+sp(NF*0.3):sp(NF*s.rr*LHx+NF*0.3);
  if(s.head)inner+=gl(s.head,NF*s.rn);
  if(s.gapU>0)inner+=sp(s.gapU*NF*s.rn*LHx);
  inner+=gl(s.tail,NF*s.rn);
  return `<div class="fuda-col${on}">${inner}</div>`;
 };
 return shell(g.rows.map(r=>`<div class="fuda-row" style="gap:${U(M.W*0.06)}">${r.map(col).join('')}</div>`).join(''));
}

/* 印字領域に収まっているか（PoC の fit_report と同じ計算） */
function fitCheck(l){
 const g=fudaGeom(l),M=g.M;
 const end=g.bodyTop+g.offset+g.usedH, lim=M.H-M.bottom-g.ftBand;
 return {end,lim,ok:end<=lim+0.01,nf:g.NF,use:g.usedH/g.bodyH,slack:g.slack};
}

     <input class="form-control" value="${esc(c.title)}" placeholder="代表取締役" oninput="setC(${ci},'title',this.value)"></div>
    <div class="fld" style="margin-bottom:0"><label>お名前（よく使う名義→編集可）</label>
     <div class="chips">${CORP_QUICK.map(q=>`<span class="chip${c.name===q?' on':''}" onclick="setC(${ci},'name','${q}',1)">${q}</span>`).join('')}</div>
     <div style="display:flex;gap:6px">

 f+=`<div class="fld"><label>備考・メモ（旧漢字・外字・指示など）</label>

 return `<h1 class="page">名札を入力</h1>

 const head=`<h1 class="page">一括取り込み</h1>

   <span class="n">${S.csvStep>i+1?'✓':i+1}</span>${t}</div>`).join('')}</div>`;
 if(S.csvStep===1)return head+`<div class="card"><div class="card-header">1. テンプレートCSVをダウンロード</div>

  <div class="flist">${Object.values(FORMATS).map(F=>`<div class="frow">
   <div class="fn mono">名札テンプレート_${esc(F.name)}.csv</div><span class="badge b-primary">${esc(F.name)}</span>
   <button class="btn btn-outline btn-sm" onclick="templateCsv('${F.id}')">ダウンロード</button></div>`).join('')}</div>
  <div class="alert alert-info" style="margin:14px 0 0">このボタンは実際にファイルが落ちます。記入して次の画面で読み込ませてください。</div></div>
  <div class="card-footer"><button class="btn btn-outline" onclick="go('s2')">戻る</button><span class="spacer"></span>
   <button class="btn btn-primary" onclick="S.csvStep=2;render()">次へ</button></div></div>`;
 if(S.csvStep===2)return head+`<div class="card"><div class="card-header">2. 記入済みのCSVをアップロード</div>

   <input type="file" accept=".csv,text/csv" id="csvFile" style="display:none" onchange="onCsvFile(this)">
   <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="document.getElementById('csvFile').click()">ファイルを選択</button>
   <button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="loadCsv()">サンプルで試す</button>
   <div class="small" style="margin-top:9px">最大10MB／UTF-8・Shift_JIS 自動判定</div></div></div>
  <div class="card-footer"><button class="btn btn-outline" onclick="S.csvStep=1;render()">戻る</button></div></div>`;
 if(S.csvStep===3){
  return head+`<div class="card"><div class="card-header">3. AIによる割当結果</div><div class="card-body">
   <p class="muted small">受け取ったデータは itowa の様式とは限りません。1つのセルに社名・肩書・氏名が混ざっている場合、AIが分解し、個人か法人かも判別します。確度の低いものを上に並べています。</p>
   <table class="table"><thead><tr><th>元のテキスト</th><th>種別</th><th>会社・団体名</th><th>肩書</th><th>お名前</th><th>確度</th></tr></thead>
   <tbody>${S.csvRows.map(r=>`<tr><td class="small">${esc(r.raw)}</td>
    <td><span class="badge ${r.kind==='corporate'?'b-info':'b-secondary'}">${r.kind==='corporate'?'法人':'個人'}</span></td>

    <td class="small">${r.ti?esc(r.ti):'<span class="muted">—</span>'}</td>
    <td class="small"><b>${esc(r.na)}</b></td>
    <td>${r.conf<0.8?'<span class="badge b-warning">要確認</span>':'<span class="badge b-success">確度高</span>'}</td></tr>`).join('')}</tbody></table>
   </div><div class="card-footer"><button class="btn btn-outline" onclick="S.csvStep=2;render()">戻る</button><span class="spacer"></span>
   <button class="btn btn-primary" onclick="S.csvStep=4;render()">確認・調整へ</button></div></div>`;
 }
 if(S.csvStep===4){
  const r=S.csvRows[S.csvEditId]||S.csvRows[0];
  const tmp=mkLabel({formatId:'F1',kind:r.kind,
   names:[{relation:'',name:r.na,isCouple:false}],

  return head+`<div class="alert alert-warn">この状態は<b>下書きとしてDBに保存</b>されます。別の端末・別の日でも続きから作業できます。</div>
  <div class="split"><div class="l"><div class="card">
   <div class="card-header">4. 1件ずつ確認する<span class="spacer"></span><span class="small muted">${S.csvRows.length} 件</span></div>

     <div class="small muted">元：${esc(x.raw)}</div></div>
    <span class="badge ${x.kind==='corporate'?'b-info':'b-secondary'}">${x.kind==='corporate'?'法人':'個人'}</span>

   <div class="card-footer"><button class="btn btn-outline" onclick="S.csvStep=3;render()">戻る</button><span class="spacer"></span>

 }
 return head+`<div class="card"><div class="card-header">5. 確定</div><div class="card-body">

 return `<h1 class="page">出力</h1>

/* ============ 微調整パネル（行ごと・相対比率） ============ */
function tuneFields(l){
 const F=[];
 if(l.kind==='individual'){
  l.names.forEach((n,i)=>{ if(!n.name.trim())return;
   if(l.withRelation)F.push({key:'r'+i,kk:'続柄',t:n.relation||'（続柄）'});
   F.push({key:'n'+i,kk:'氏名',t:n.name});});
 }else{
  l.corps.forEach((c,i)=>{
   const type=c.type==='（記載なし）'?'':c.type;
   if(c.company.trim())F.push({key:'o'+i,kk:'社名',t:type+c.company});
   if(c.title.trim())F.push({key:'t'+i,kk:'肩書',t:c.title});
   if(c.name.trim())F.push({key:'c'+i,kk:'氏名',t:c.name});});
 }
 return F;
}
function fieldMM(l){
 const g=fudaGeom(l),out={};
 g.specs.forEach(s=>{
  if(s.t==='org')out[s.key]=g.NF*s.ro;
  else if(s.t==='cname'){out[s.key]=g.NF*s.rn;if(s.tkey)out[s.tkey]=g.NF*s.rt;}
  else{out[s.key]=g.NF*s.rn;out['r'+s.key.slice(1)]=g.NF*s.rr;}
 });
 return out;
}
function tunePanel(l){
 const F=tuneFields(l),mm=fieldMM(l);
 if(!F.length)return `<div class="tune"><div class="tb"><span class="muted small">名前を入力すると調整できます。</span></div></div>`;
 return `<div class="tune"><div class="th">微調整<span class="spacer"></span>
  <button class="btn btn-outline btn-sm" onclick="resetAdj()">0に戻す</button></div>
  <div class="tb"><p class="small muted" style="margin-top:0">行ごとに調整します。<b>相対比率</b>方式のため、
   押した行は必ず相対的に大きくなり、そのぶん他の行が小さくなります。全体は常に印字領域に収まります。</p>
  ${F.map(f=>{const a=l.adj[f.key]||0;return `<div class="slrow">
   <div class="slh"><span class="kk">${f.kk}</span><span class="lab">${esc(f.t)}</span>
    <span class="mm" data-mm="${f.key}">${(mm[f.key]||0).toFixed(1)}mm</span>
    <span class="val ${a===0?'z':''}" data-v="${f.key}">${a>0?'+':''}${a}</span></div>
   <input type="range" min="-5" max="5" step="1" value="${a}" oninput="setAdj('${f.key}',this.value)"></div>`;}).join('')}
  <div class="help">名札1枚ごとに保存されます。この画面でのみ調整でき、注文管理やアプリには表示されません。</div>
 </div></div>`;
}

const cur=()=>LABELS.find(l=>l.id===S.editId);
function refresh(){
 const l=cur();if(!l)return;
 const bump=new Set(Object.keys(l.adj).filter(k=>l.adj[k]!==0));
 const box=document.getElementById('fudabox');
 if(box)box.innerHTML=fudaHtml(l,300,true,bump);
 const pv=document.getElementById('pvtext');if(pv)pv.textContent=composeLabel(l)||'—';
 const bd=document.getElementById('lbadge');
 if(bd){const ok=labelFilled(l);bd.className='badge '+(ok?'b-success':'b-secondary');bd.textContent=ok?'名札 入力済':'名札 未入力';}
 const btn=[...document.querySelectorAll('.card-footer .btn-primary')].find(b=>b.textContent.includes('確定する'));
 if(btn)btn.disabled=!labelFilled(l);
 const mm=fieldMM(l);
 document.querySelectorAll('[data-mm]').forEach(e=>{e.textContent=(mm[e.dataset.mm]||0).toFixed(1)+'mm';});
}
function setKind(k){cur().kind=k;cur().adj={};render();}
function setRel(v){cur().withRelation=v;cur().adj={};render();}
function setCouple(i,v){cur().names[i].isCouple=v;render();}
function setN(i,f,v){cur().names[i][f]=v;refresh();}
function setC(i,f,v,re){cur().corps[i][f]=v;re?render():refresh();}
function setQuick(i,v){cur().names[i].name=v;render();}
function setNote(v){cur().note=v;}
function addName(){cur().names.push({relation:'',name:'',isCouple:false});render();}
function rmName(){const l=cur();l.names.pop();l.adj={};render();}
function addCorp(){cur().corps.push({type:'株式会社',company:'',title:'代表取締役',name:''});render();}
function rmCorp(){const l=cur();l.corps.pop();l.adj={};render();}
function setAdj(k,v){
 const l=cur();l.adj[k]=+v;
 const bump=new Set(Object.keys(l.adj).filter(x=>l.adj[x]!==0));
 const box=document.getElementById('fudabox');if(box)box.innerHTML=fudaHtml(l,300,true,bump);
 const mm=fieldMM(l);
 document.querySelectorAll('[data-mm]').forEach(e=>{e.textContent=(mm[e.dataset.mm]||0).toFixed(1)+'mm';});
 const el=document.querySelector('[data-v="'+k+'"]');
 if(el){const a=l.adj[k];el.textContent=(a>0?'+':'')+a;el.classList.toggle('z',a===0);}
}
function resetAdj(){cur().adj={};render();}

 G.open=true;G.step=1;G.parent=null;G.pick=null;G.q='';
 G.target={kind,idx,field};
 renderModal();
}
function closeGaiji(){G.open=false;document.getElementById('modal').classList.remove('on');}
function gSearch(v){
 G.q=v;
 const hit=GAIJI_TREE[v.trim().slice(-1)];
 if(hit){G.parent=v.trim().slice(-1);G.step=2;}
 renderModal();
}
function pickParent(p){G.parent=p;G.step=2;G.pick=null;renderModal();}
function pickChild(mj){
 const c=GAIJI_TREE[G.parent].find(x=>x.mj===mj);
 G.pick=c;G.step=3;renderModal();
}
function insertGaiji(){
 const l=cur(),t=G.target,c=G.pick;
 const ch=c.c||('〓');
 if(t.kind==='n')l.names[t.idx][t.field]=(l.names[t.idx][t.field]||'')+ch;
 else l.corps[t.idx][t.field]=(l.corps[t.idx][t.field]||'')+ch;
 closeGaiji();render();
}

   細かな違いは拡大して確認してください。MJ番号が違えば別の字として扱われます。</div>`;

 if(G.step===3){

 }

 const foot=`<div class="mfoot">

/* ============ ファイル入出力（実際に動きます） ============ */
function download(name,text,mime){
 const bom=mime.startsWith('text/csv')?'\uFEFF':'';   // Excel で文字化けさせない
 const url=URL.createObjectURL(new Blob([bom+text],{type:mime+';charset=utf-8'}));
 const a=document.createElement('a');
 a.href=url; a.download=name; document.body.appendChild(a); a.click();
 setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);
}
const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
const toCsv=rows=>rows.map(r=>r.map(q).join(',')).join('\r\n');

/* RFC4180 風の簡易パーサ */
function parseCsvText(t){
 t=t.replace(/^\uFEFF/,'');
 const rows=[];let row=[],cell='',inQ=false;
 for(let i=0;i<t.length;i++){
  const c=t[i];
  if(inQ){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=c; }
  else if(c==='"')inQ=true;
  else if(c===','){row.push(cell);cell='';}
  else if(c==='\n'){row.push(cell);cell='';rows.push(row);row=[];}
  else if(c!=='\r')cell+=c;
 }
 if(cell||row.length){row.push(cell);rows.push(row);}
 return rows.filter(r=>r.some(x=>x.trim()));
}

/* アップロードされたCSVを取り込む */
function onCsvFile(input){
 const f=input.files&&input.files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const rows=parseCsvText(String(r.result));
   const body=rows.slice(1);
   if(!body.length){alert('データ行がありません');return;}
   S.csvRows=body.map(c=>{
    const kind=(c[0]||'').includes('法')?'corporate':'individual';
    const co=(c[2]||'').trim(), ti=(c[3]||'').trim();
    const names=[c[4],c[5],c[6]].map(x=>(x||'').trim()).filter(Boolean);
    return {raw:c.filter(Boolean).join(' ').trim(),kind,co,ti,
            na:names[0]||'',names,conf:co&&!ti?0.74:0.93};
   }).filter(x=>x.na||x.co);
   S.csvRows.sort((a,b)=>a.conf-b.conf);
   S.csvStep=3;S.csvEditId=0;render();
  }catch(e){alert('読み込めませんでした：'+e.message);}
 };
 r.readAsText(f,'UTF-8');
}

 document.querySelectorAll('.slrow').forEach(row=>{
  const inp=row.querySelector('input[type=range]');
  if(!inp||!inp.getAttribute('oninput').startsWith('setCap'))return;
  const k=inp.getAttribute('oninput').match(/setCap\('(\w+)'/)[1];
  row.querySelector('.mm').textContent=F.cap[k]+' mm';
  row.querySelector('.val').textContent=(F.cap[k]/0.352778).toFixed(0)+' pt';
 });

 if(box)render();
}
