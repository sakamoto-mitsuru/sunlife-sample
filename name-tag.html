<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名札作成｜itowa（サン・ライフ様 仕様モック）</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/biz.css" rel="stylesheet">
<link href="assets/fuda.css" rel="stylesheet">
</head>
<body>
<div class="shell">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <span class="title">名札作成</span>
      <span class="spacer"></span>
      <span class="small muted">サンシーガル厚木本部</span>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="modal"></div>

<script src="assets/vendor/html2canvas.min.js"></script>
<script src="assets/vendor/jspdf.umd.min.js"></script>
<script src="assets/fuda.js"></script>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/pdf.js"></script>
<script>
NAV.mount('nametag');
const $=s=>document.querySelector(s), esc=FUDA.esc;

/* ============================================================
   作業データ（モックなのでメモリ上だけ。画面を閉じると消えます）
   ============================================================ */
let LIST=DATA.ORDERS.map(o=>({
  id:o.id, no:o.no, funeralId:o.funeralId, itemId:o.itemId, qty:o.qty,
  route:o.routeLabel, status:'fixed', note:'',
  label:Object.assign({adj:{},perRow:0},JSON.parse(JSON.stringify(o.label)))
}));
let seq=0;
const S={view:'list', editId:null, sel:new Set(), tune:true,
         fFun:'', fFmt:'', fSt:'', fQ:''};

/* ---------- よく使う名義・肩書（現行システムのワンタップ候補） ---------- */
const QUICK      =['子供一同','孫一同','親族一同','兄弟一同','姉妹一同','友人一同','家一同'];
const CORP_QUICK =['有志一同','社員一同','従業員一同','部一同','一同'];
const TITLE_QUICK=['代表取締役社長','代表取締役','会長','社長','専務取締役','常務取締役','取締役','執行役員','代表','店長','理事長','院長'];
const CORP_TYPES =['（記載なし）','株式会社','有限会社','合同会社','合資会社','合名会社','一般社団法人','医療法人'];
const LEADS      =['','孫','子','兄弟','姉妹','親族','友人','喪主'];
const MAX_NAMES=12, MAX_CORPS=2;

/* ---------- 外字（旧字・異体字）---------- */
const GAIJI=['髙','﨑','嵜','栁','德','濵','濱','邉','邊','齋','齊','𠮷'];
const GAIJI_TREE={
 '高':[{c:'高',mj:'MJ028903',n:'標準字体'},{c:'髙',mj:'MJ028927',n:'はしごだか'},
       {c:'',mj:'MJ028931',n:'口の下が長い形'}],
 '崎':[{c:'崎',mj:'MJ008967',n:'標準字体'},{c:'﨑',mj:'MJ008969',n:'たつさき'},
       {c:'嵜',mj:'MJ008971',n:'山が上'},{c:'',mj:'MJ008973',n:'大が立の形'}],
 '辺':[{c:'辺',mj:'MJ025760',n:'標準字体'},{c:'邊',mj:'MJ039469',n:'旧字'},
       {c:'邉',mj:'MJ039472',n:'旧字（異体）'},{c:'',mj:'MJ039475',n:'鼻の下が方'}],
 '柳':[{c:'柳',mj:'MJ014806',n:'標準字体'},{c:'栁',mj:'MJ014809',n:'卯が異体'},
       {c:'桺',mj:'MJ014811',n:'木へん異体'}],
 '徳':[{c:'徳',mj:'MJ011176',n:'標準字体'},{c:'德',mj:'MJ011179',n:'旧字（心の上に一）'}],
 '浜':[{c:'浜',mj:'MJ016885',n:'標準字体'},{c:'濱',mj:'MJ016889',n:'旧字'},
       {c:'濵',mj:'MJ016891',n:'旧字（異体）'}],
 '斉':[{c:'斉',mj:'MJ010045',n:'標準字体'},{c:'齊',mj:'MJ061105',n:'旧字'},
       {c:'齋',mj:'MJ061107',n:'いつきのさい'},{c:'斎',mj:'MJ010047',n:'常用字体'}],
 '吉':[{c:'吉',mj:'MJ006177',n:'標準字体'},{c:'𠮷',mj:'MJ006180',n:'つちよし'}],
};

/* ---------- 微調整できるフィールド ---------- */
const ADJF=[['na','個人名','名'],['cn','名前（法人）','名'],['co','会社・団体名','社'],
            ['ti','肩書','職'],['rel','続柄（小）','柄'],['lead','頭の語','頭']];
const ADJ_T={na:'name',cn:'cname',co:'org',ti:'title',lead:'lead'};

/* ============================================================
   共通の小道具
   ============================================================ */
const rec=()=>LIST.find(r=>r.id===S.editId);
const fun=id=>DATA.FUNERALS.find(f=>f.id===id);
function filled(r){ const L=r.label;
  return L.kind==='ind' ? (L.names||[]).some(n=>(n.na||'').trim())
                        : (L.corps||[]).some(p=>(p.co||p.na||'').trim()); }
function rows(){
  const q=(S.fQ||'').trim();
  return LIST.filter(r=>(!S.fFun||r.funeralId===S.fFun)&&(!S.fFmt||r.label.fmt===S.fFmt)
    &&(!S.fSt||r.status===S.fSt)&&(!q||FUDA.summary(r.label).includes(q)));
}
function fieldMM(L){
  const g=FUDA.geom(L), out={};
  (g.sp||[]).forEach(x=>{
    if(x.t==='name'){ out.na=g.K*x.k; if(x.relW) out.rel=g.K*x.relW; }
    else if(x.t==='cname') out.cn=g.K*x.k;
    else if(x.t==='org')   out.co=g.K*x.k;
    else if(x.t==='title') out.ti=g.K*x.k;
    else if(x.t==='lead')  out.lead=g.K*x.k;
  });
  return out;
}
function gaijiIn(L){
  const t=[];
  (L.names||[]).forEach(n=>t.push(n.na,n.rel));
  (L.corps||[]).forEach(p=>t.push(p.co,p.ti,p.na));
  t.push(L.lead);
  const hit=[...new Set(t.join('').split('').filter(c=>GAIJI.includes(c)))];
  return hit;
}
/* 値を onclick に安全に埋める */
const arg=v=>JSON.stringify(v).replace(/"/g,'&quot;');
const chipRow=(opts,now,fn)=>`<div class="chips">`+opts.map(([v,l])=>
  `<button type="button" class="chip${now===v?' on':''}" onclick="${fn}(${arg(v)})">${esc(l)}</button>`).join('')+`</div>`;

function go(v,o){ if(o)Object.assign(S,o); S.view=v; render(); window.scrollTo(0,0); }
function render(){ $('#content').innerHTML = S.view==='edit' ? viewEdit() : viewList(); }

/* ============================================================
   一覧画面
   ============================================================ */
function viewList(){
  const list=rows();
  const nFix=LIST.filter(r=>r.status==='fixed').length;
  const byFmt={}; LIST.forEach(r=>{const f=FUDA.FORMATS[r.label.fmt]; if(f) byFmt[f.key]=(byFmt[f.key]||0)+1;});
  const ng=LIST.filter(r=>FUDA.verdict(FUDA.geom(r.label))[0]==='warn').length;

  const tr=list.map(r=>{
    const f=fun(r.funeralId), fm=FUDA.FORMATS[r.label.fmt];
    const [vk,vm]=FUDA.verdict(FUDA.geom(r.label));
    const nAdj=ADJF.filter(([k])=>r.label.adj&&r.label.adj[k]).length;
    return `<tr>
      <td style="width:32px"><input type="checkbox" ${S.sel.has(r.id)?'checked':''}
        onchange="toggleSel('${r.id}')"></td>
      <td class="mono" style="width:68px">${r.no?('#'+String(r.no).padStart(3,'0')):'新規'}</td>
      <td>${filled(r)?esc(FUDA.summary(r.label)):'<span class="muted">未入力</span>'}
        ${nAdj?`<span class="badge b-primary" style="margin-left:6px">微調整 ${nAdj}</span>`:''}</td>
      <td class="nowrap">${f?esc(f.name):'—'}</td>
      <td class="nowrap">${fm?esc(fm.name):'—'}</td>
      <td class="nowrap small muted">${esc(DATA.ITEM(r.itemId).name)}${r.qty>1?' ×'+r.qty:''}</td>
      <td>${r.status==='fixed'?'<span class="badge b-success">確定</span>'
                              :'<span class="badge b-warning">下書き</span>'}</td>
      <td><span class="fv ${vk}">${esc(vm)}</span></td>
      <td class="nowrap">
        <button class="btn btn-outline btn-sm" onclick="editLabel('${r.id}')">編集</button>
        <button class="btn btn-outline btn-sm" onclick="dupLabel('${r.id}')">複製</button></td>
    </tr>`;}).join('');

  return `<div class="crumb"><a href="orders.html">注文管理</a> ／ 名札作成</div>
  <h1 class="page">名札作成</h1>

  <div class="alert alert-info"><b>このモックについて</b>　寸法と組み方は、ヒアリングシートのご回答と
   名札パターン表70種の実測から起こしています。一覧の名札は、そのパターン表70種をそのまま入れたものです。
   保存はされません。</div>

  <div class="tiles">
    <div class="tile accent"><div class="k">名札 総数</div><div class="v">${LIST.length}<small>枚</small></div></div>
    <div class="tile"><div class="k">確定済</div><div class="v">${nFix}<small>枚</small></div></div>
    <div class="tile"><div class="k">下書き</div><div class="v">${LIST.length-nFix}<small>枚</small></div></div>
    <div class="tile"><div class="k">要確認</div><div class="v">${ng}<small>枚</small></div>
      <div class="small muted">字間・はみ出しの判定</div></div>
  </div>

  <div class="card">
    <div class="card-header">名札リスト<span class="spacer"></span>
      <button class="btn btn-primary btn-sm" onclick="addNew()"><i class="fas fa-plus"></i> 個別に作成</button>
      <button class="btn btn-success btn-sm" id="pdfBtn" ${S.sel.size?'':'disabled'} onclick="doPdf()">
        <i class="fas fa-file-pdf"></i> 選択したものを出力</button>
    </div>
    <div class="card-body">
      <div class="row" style="margin-bottom:12px">
        <div style="min-width:200px"><label class="fl">葬家</label>
          <select class="custom-select" onchange="S.fFun=this.value;render()">${sel(
            DATA.FUNERALS.map(f=>[f.id,f.name+'（'+f.hall+'）']),S.fFun,'すべての葬家')}</select></div>
        <div style="min-width:160px"><label class="fl">札の種類</label>
          <select class="custom-select" onchange="S.fFmt=this.value;render()">${sel(
            Object.values(FUDA.FORMATS).map(f=>[f.key,f.name+'　'+f.call]),S.fFmt,'すべての札')}</select></div>
        <div style="min-width:130px"><label class="fl">状態</label>
          <select class="custom-select" onchange="S.fSt=this.value;render()">${sel(
            [['fixed','確定'],['draft','下書き']],S.fSt,'すべての状態')}</select></div>
        <div style="flex:1 1 200px"><label class="fl">名義で探す</label>
          <input class="form-control" type="text" value="${esc(S.fQ)}" placeholder="平塚、株式会社 など"
            oninput="S.fQ=this.value;listOnly()"></div>
      </div>

      ${list.length?`<table class="table"><thead><tr>
        <th style="width:32px"><input type="checkbox" onchange="selAll(this.checked)"></th>
        <th>No.</th><th>名札の内容</th><th>葬家</th><th>札の種類</th><th>商品</th>
        <th>状態</th><th>収まり</th><th></th></tr></thead>
        <tbody>${tr}</tbody></table>`
       :`<div class="empty">条件に合う名札がありません</div>`}

      <div class="toolbar" style="margin-top:12px">
        <span class="muted small" id="selInfo">${selText()}</span>
        <span class="spacer"></span>
        <button class="btn btn-outline btn-sm" onclick="selAll(true)">表示中をすべて選択</button>
        <button class="btn btn-outline btn-sm" onclick="selAll(false)">選択を解除</button>
      </div>
      <p class="help">PDFは<b>札の種類ごとに分かれて</b>出ます（生花札／芳名札／スロープ・枕札）。
        ページの大きさは札の実寸です。背景は塗らず、黒のインクだけを載せています。</p>
      <div id="pdfLog"></div>
    </div>
  </div>
  <p class="small muted">${list.length} 件を表示（全 ${LIST.length} 件）</p>`;
}
function sel(opts,now,all){
  return `<option value="">${all}</option>`+opts.map(([v,l])=>
    `<option value="${esc(v)}" ${now===v?'selected':''}>${esc(l)}</option>`).join('');
}
function selText(){
  const ch=LIST.filter(r=>S.sel.has(r.id)); if(!ch.length) return 'チェックで名札を選んでください。';
  const by={}; ch.forEach(r=>{const f=FUDA.FORMATS[r.label.fmt]; if(f) by[f.name]=(by[f.name]||0)+r.qty;});
  const p=Object.entries(by).map(([k,v])=>`${k} ${v}枚`);
  return `選択 ${ch.length} 件　／　${p.join('　')}　→　PDF ${p.length}ファイル`;
}
function listOnly(){ render(); const e=$('#content input[placeholder^="平塚"]');
  if(e){e.focus(); e.setSelectionRange(e.value.length,e.value.length);} }
function toggleSel(id){ S.sel.has(id)?S.sel.delete(id):S.sel.add(id);
  const i=$('#selInfo'); if(i)i.textContent=selText();
  const b=$('#pdfBtn'); if(b)b.disabled=!S.sel.size; }
function selAll(on){ rows().forEach(r=>on?S.sel.add(r.id):S.sel.delete(r.id)); render(); }

function editLabel(id){ S.editId=id; go('edit'); }
function dupLabel(id){
  const src=LIST.find(r=>r.id===id); seq++;
  const r=Object.assign({},src,{id:'NEW'+seq,no:0,status:'draft',
    label:JSON.parse(JSON.stringify(src.label))});
  LIST.unshift(r); S.editId=r.id; go('edit');
}
function addNew(){
  seq++;
  const r={id:'NEW'+seq,no:0,funeralId:S.fFun||DATA.FUNERALS[0].id,itemId:'I1',qty:1,
    route:'手入力',status:'draft',note:'',
    label:{fmt:S.fFmt||'seika',adj:{},kind:'ind',lead:'',withRel:false,perRow:0,
           names:[{na:'',rel:'',couple:false}],
           corps:[{type:'株式会社',co:'',ti:'代表取締役',na:''}]}};
  LIST.unshift(r); S.editId=r.id; go('edit');
}

/* ============================================================
   名札を入力（1枚ずつ）
   ============================================================ */
function viewEdit(){
  const r=rec(); if(!r) return '<div class="empty">名札が選択されていません</div>';
  const L=r.label, f=fun(r.funeralId), fm=FUDA.FORMATS[L.fmt];
  const sibs=LIST.filter(x=>x.funeralId===r.funeralId);
  const gj=gaijiIn(L);

  return `<div class="crumb"><a href="orders.html">注文管理</a> ／
    <a href="#" onclick="go('list');return false">名札作成</a> ／ 名札を入力</div>
  <h1 class="page">名札を入力</h1>

  <div class="split">
    <div class="l">
      <div class="card">
        <div class="card-header">この名札の宛先
          <span class="spacer"></span>
          <span class="small muted mono">${esc(r.id)}${r.no?'　パターン#'+String(r.no).padStart(3,'0'):''}</span>
          <span class="badge ${r.status==='fixed'?'b-success':'b-warning'}">${
            r.status==='fixed'?'確定':'下書き'}</span></div>
        <div class="card-body"><div class="row">
          <div style="flex:1 1 200px"><label class="fl">葬家</label>
            <select class="custom-select" onchange="setFun(this.value)">${
              DATA.FUNERALS.map(f=>`<option value="${f.id}" ${r.funeralId===f.id?'selected':''}
                >${esc(f.name)}（${esc(f.hall)}）</option>`).join('')}</select></div>
          <div style="flex:1 1 200px"><label class="fl">商品</label>
            <select class="custom-select" onchange="setItem(this.value)">${
              DATA.ITEMS.map(it=>`<option value="${it.id}" ${r.itemId===it.id?'selected':''}
                >${esc(it.name)}</option>`).join('')}</select></div>
          <div style="width:96px"><label class="fl">枚数</label>
            <select class="custom-select" onchange="setQty(this.value)">${
              [1,2,3,4,5].map(q=>`<option value="${q}" ${r.qty===q?'selected':''}>${q} 枚</option>`).join('')}</select></div>
          <div><label class="fl">受け口</label><div class="badge b-secondary"
            style="padding:7px 10px">${esc(r.route)}</div></div>
        </div></div>
      </div>

      <div class="card">
        <div class="card-header">${esc(DATA.ITEM(r.itemId).name)}
          <span class="badge b-primary">${esc(fm.name)}</span>
          <span class="small muted">${fm.call}／${fm.W}×${fm.H}mm</span>
          <span class="spacer"></span>
          <span class="badge ${filled(r)?'b-success':'b-secondary'}" id="lbadge">${
            filled(r)?'名札 入力済':'名札 未入力'}</span>
        </div>
        <div class="card-body">${formHtml(r)}
          <div class="fld" style="margin-top:12px"><label>備考・メモ（旧漢字・外字・指示など）</label>
            <textarea class="form-control" rows="2" placeholder="例）「髙」は旧字／「﨑」は立つ崎"
              oninput="setNote(this.value)">${esc(r.note)}</textarea></div>
          <div class="pvline">名札プレビュー：<b id="pvtext">${esc(FUDA.summary(L))||'—'}</b></div>
          ${gj.length?`<div class="alert alert-warn" style="margin:12px 0 0">
            外字の可能性がある文字が含まれています：<b>${gj.map(esc).join('　')}</b>
            <div class="small" style="margin-top:4px">MJ番号まで特定しておくと、字形の取り違えを防げます。
             違う字形が必要な場合は、各入力欄の「字が出ない」から探してください。</div></div>`:''}
        </div>
        <div class="card-footer">
          <button class="btn btn-outline" onclick="go('list')"><i class="fas fa-arrow-left"></i> 名札リストへ戻る</button>
          <span class="spacer"></span>
          <button class="btn btn-outline" onclick="saveDraft()">下書き保存</button>
          <button class="btn btn-primary" id="fixBtn" ${filled(r)?'':'disabled'} onclick="fixLabel()">確定する</button>
        </div>
      </div>

      ${sibs.length>1?`<div class="card">
        <div class="card-header">${f?esc(f.name):''} の名札（${sibs.length}）</div>
        <div class="flist" style="border:none">${sibs.slice(0,12).map(x=>`<div class="frowx ${x.id===r.id?'on':''}">
          <div class="fn">${filled(x)?esc(FUDA.summary(x.label)):'<span class="muted">未入力</span>'}</div>
          <span class="badge ${x.status==='fixed'?'b-success':'b-warning'}">${
            x.status==='fixed'?'確定':'下書き'}</span>
          ${x.id===r.id?'<span class="badge b-primary">編集中</span>'
            :`<button class="btn btn-outline btn-sm" onclick="editLabel('${x.id}')">編集</button>`}
        </div>`).join('')}</div>
        ${sibs.length>12?`<div class="card-footer"><span class="small muted">
          ほか ${sibs.length-12} 枚は名札リストから開いてください。</span></div>`:''}
      </div>`:''}
    </div>

    <div class="r">
      <div class="card">
        <div class="card-header">プレビュー<span class="spacer"></span>
          <span class="small muted">実寸 ${fm.W}×${fm.H}mm</span></div>
        <div class="card-body" style="display:flex;justify-content:center" id="fudabox">${
          FUDA.html(L,300,{area:true})}</div>
        <div class="card-body" style="border-top:1px solid var(--border);padding-top:11px" id="metrics">${
          metricsHtml(L)}</div>
        <div class="card-footer">
          <button class="btn ${S.tune?'btn-primary':'btn-outline-primary'}" style="width:100%"
            onclick="S.tune=!S.tune;render()">微調整 ${S.tune?'を閉じる':'を開く'}</button></div>
      </div>
      ${S.tune?tunePanel(L):''}
    </div>
  </div>`;
}

/* ---------- 入力フォーム ---------- */
function formHtml(r){
  const L=r.label;
  let h='';

  h+=`<div class="fld"><label>札の種類</label>
    ${chipRow(Object.values(FUDA.FORMATS).map(f=>[f.key,f.name+'　'+f.call]),L.fmt,'setFmt')}</div>`;

  h+=`<div class="fld"><label>お名前の種類</label><div style="display:flex;gap:6px">
    <button type="button" class="btn ${L.kind==='ind'?'btn-primary':'btn-outline'}"
      onclick="setKind('ind')">個人・連名</button>
    <button type="button" class="btn ${L.kind==='corp'?'btn-primary':'btn-outline'}"
      onclick="setKind('corp')">会社・団体</button></div></div>`;

  if(L.kind==='ind'){
    h+=`<div class="fld"><label>頭に大きく置く語</label>
      ${chipRow(LEADS.map(v=>[v,v||'なし']),L.lead||'','setLead')}
      <div class="help">「孫」「子」のように、名義の前に大きく入れる語です。使わないときは「なし」。</div></div>`;

    h+=`<label class="cbline"><input type="checkbox" ${L.withRel?'checked':''}
      onchange="setRel(this.checked)"> 続柄を付ける（親族など）</label>`;

    (L.names||[]).forEach((n,i)=>{
      h+=`<div class="subbox">
        <div class="cap">${i+1}人目　よく使う名義（ワンタップ）</div>
        <div class="chips">${QUICK.map(q=>
          `<button type="button" class="chip${n.na===q?' on':''}" onclick="setQuick(${i},${arg(q)})">${esc(q)}</button>`).join('')}</div>
        ${i>0?`<label class="cbline"><input type="checkbox" ${n.couple?'checked':''}
          onchange="setCouple(${i},this.checked)"> 夫婦・同姓（名だけ入れる）</label>`:''}
        ${L.withRel?`<div class="fld"><label>続柄</label>
          <input class="form-control" type="text" value="${esc(n.rel)}" placeholder="長男"
            oninput="setN(${i},'rel',this.value)"></div>`:''}
        <div class="fld" style="margin-bottom:0">
          <label>${n.couple?`名（${i+1}人目）`:(i===0?'氏名':`氏名（${i+1}人目）`)}</label>
          <div style="display:flex;gap:6px">
            <input class="form-control" type="text" id="na${i}" value="${esc(n.na)}"
              placeholder="${n.couple?'花子':'平塚 太郎'}" oninput="setN(${i},'na',this.value)">
            <button type="button" class="btn btn-outline btn-sm nowrap"
              onclick="openGaiji('n',${i},'na')">字が出ない</button></div>
          ${i===0?'<div class="help">姓と名のあいだは、半角または全角のスペースで区切ってください。</div>':''}
        </div></div>`;
    });

    h+=`<div style="display:flex;gap:8px;margin-bottom:10px">
      ${L.names.length>1?`<button type="button" class="btn btn-outline btn-sm" onclick="rmN()">− 削除</button>`:''}
      ${L.names.length<MAX_NAMES
        ? `<button type="button" class="btn btn-outline btn-sm" style="margin-left:auto" onclick="addN()">＋ 名義を追加</button>`
        : `<span class="help" style="margin-left:auto">上限 ${MAX_NAMES} 名</span>`}</div>`;

    h+=`<div class="fld"><label>1段あたりの人数（この札だけ）</label>
      ${chipRow([[0,'全体にあわせる'],[2,'2人'],[3,'3人'],[4,'4人'],[5,'5人'],[6,'6人']],L.perRow||0,'setPer')}
      <div class="help">何も選ばなければ、名札マスタの既定（${FUDA.MEAS.perRow}人）で段組みします。</div></div>`;

  }else{
    (L.corps||[]).forEach((p,i)=>{
      h+=`<div class="subbox">
        <div class="cap">団体 ${i+1}</div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <div class="fld" style="width:140px;margin-bottom:0"><label>会社種別</label>
            <select class="custom-select" onchange="setC(${i},'type',this.value,1)">${
              CORP_TYPES.map(t=>`<option ${(p.type||'（記載なし）')===t?'selected':''}>${t}</option>`).join('')}</select></div>
          <div class="fld" style="flex:1;margin-bottom:0"><label>会社・団体名</label>
            <div style="display:flex;gap:6px">
              <input class="form-control" type="text" value="${esc(p.co)}" placeholder="平塚商会"
                oninput="setC(${i},'co',this.value)">
              <button type="button" class="btn btn-outline btn-sm nowrap"
                onclick="openGaiji('c',${i},'co')">字が出ない</button></div></div>
        </div>
        <div class="fld"><label>役職・肩書き（よく使う肩書き→編集できます）</label>
          <div class="chips">${TITLE_QUICK.map(t=>
            `<button type="button" class="chip${p.ti===t?' on':''}" onclick="setC(${i},'ti',${arg(t)},1)">${esc(t)}</button>`).join('')}</div>
          <input class="form-control" type="text" value="${esc(p.ti)}" placeholder="代表取締役"
            oninput="setC(${i},'ti',this.value)"></div>
        <div class="fld" style="margin-bottom:0"><label>お名前（よく使う名義→編集できます）</label>
          <div class="chips">${CORP_QUICK.map(q=>
            `<button type="button" class="chip${p.na===q?' on':''}" onclick="setC(${i},'na',${arg(q)},1)">${esc(q)}</button>`).join('')}</div>
          <div style="display:flex;gap:6px">
            <input class="form-control" type="text" value="${esc(p.na)}" placeholder="平塚 太郎"
              oninput="setC(${i},'na',this.value)">
            <button type="button" class="btn btn-outline btn-sm nowrap"
              onclick="openGaiji('c',${i},'na')">字が出ない</button></div></div>
      </div>`;
    });
    h+=`<div style="display:flex;gap:8px;margin-bottom:10px">
      ${L.corps.length>1?`<button type="button" class="btn btn-outline btn-sm" onclick="rmC()">− 団体を削除</button>`:''}
      ${L.corps.length<MAX_CORPS
        ? `<button type="button" class="btn btn-outline btn-sm" style="margin-left:auto" onclick="addC()">＋ 団体を追加</button>`
        : `<span class="help" style="margin-left:auto">上限 ${MAX_CORPS} 件</span>`}</div>`;
  }
  return h;
}

/* ---------- 右の数値 ---------- */
function metricsHtml(L){
  const g=FUDA.geom(L), [vk,vm]=FUDA.verdict(g);
  if(g.empty) return `<div style="text-align:center"><span class="fv ${vk}">${esc(vm)}</span></div>`;
  return `<div style="text-align:center;margin-bottom:9px"><span class="fv ${vk}">${esc(vm)}</span></div>
  <table class="table" style="font-size:12.5px">
    <tr><th style="width:48%">文字サイズ</th><td class="num">${g.Kmain.toFixed(1)} mm
      <span class="muted">（${FUDA.mm2pt(g.Kmain)} pt）</span></td></tr>
    <tr><th>字送り</th><td class="num">${g.LH.toFixed(2)} 倍</td></tr>
    <tr><th>列数 ／ 段数</th><td class="num">${g.mc} 列 ／ ${g.nR} 段</td></tr>
    <tr><th>最長の列</th><td class="num">${g.maxChars} 字</td></tr>
    <tr><th>縦の占有</th><td class="num">${Math.round(g.usedH/g.bodyH*100)} %</td></tr>
    <tr><th>効いた制約</th><td class="num">${g.bind}</td></tr>
  </table>`;
}

/* ---------- 微調整パネル ---------- */
function tunePanel(L){
  const sp=FUDA.specsOf(L,FUDA.MEAS), kinds=new Set(sp.map(x=>x.t)), mm=fieldMM(L);
  const hasRel=L.withRel&&sp.some(x=>x.t==='name');
  const alone=kinds.size<=1;
  if(!kinds.size) return `<div class="tune"><div class="tb">
    <span class="muted small">名義を入れると、調整できる項目が出ます。</span></div></div>`;
  return `<div class="tune">
    <div class="th">微調整<span class="spacer"></span>
      <button class="btn btn-outline btn-sm" onclick="resetAdj()">0に戻す</button></div>
    <div class="tb">
      <p class="small muted" style="margin-top:0">フィールドごとに ±5 段階、1段階が5%です。
        <b>相対比率</b>方式のため、上げた行は必ず相対的に大きくなり、そのぶん他の行が小さくなります。
        全体はつねに印字領域に収まります。</p>
      ${ADJF.map(([k,lab,kk])=>{
        const v=(L.adj&&L.adj[k])||0;
        const present = k==='rel'?hasRel:kinds.has(ADJ_T[k]);
        const dead = !present || (alone && k!=='rel');
        return `<div class="slrow ${dead?'dead':''}">
          <div class="slh"><span class="kk">${kk}</span><span class="lab">${lab}</span>
            <span class="mm" data-mm="${k}">${(mm[k]||0).toFixed(1)}mm</span>
            <span class="val ${v===0?'z':''}" data-v="${k}">${v>0?'+':''}${v}</span></div>
          <input type="range" min="-5" max="5" step="1" value="${v}" ${dead?'disabled':''}
            oninput="setAdj('${k}',this.value)"></div>`;}).join('')}
      ${alone?`<p class="small" style="color:#856404">この札は列が全部おなじ種類なので、
        個々の大きさを動かしても結果は変わりません。</p>`:''}
      <div class="help">微調整は名札1枚ごとに保存されます。この画面でのみ調整でき、
        注文管理やお客様の画面には出ません。</div>
    </div></div>`;
}

/* ============================================================
   操作
   ============================================================ */
function refresh(){                     /* 入力中は組み直さず、表示だけ更新 */
  const r=rec(); if(!r) return; const L=r.label;
  const box=$('#fudabox'); if(box) box.innerHTML=FUDA.html(L,300,{area:true});
  const mt=$('#metrics'); if(mt) mt.innerHTML=metricsHtml(L);
  const pv=$('#pvtext'); if(pv) pv.textContent=FUDA.summary(L)||'—';
  const bd=$('#lbadge'); if(bd){ const ok=filled(r);
    bd.className='badge '+(ok?'b-success':'b-secondary'); bd.textContent=ok?'名札 入力済':'名札 未入力'; }
  const fb=$('#fixBtn'); if(fb) fb.disabled=!filled(r);
  const mm=fieldMM(L);
  document.querySelectorAll('[data-mm]').forEach(e=>{
    e.textContent=(mm[e.dataset.mm]||0).toFixed(1)+'mm';});
}
function touch(){ const r=rec(); if(r&&r.status==='fixed') r.status='draft'; }

function setFun(v){ rec().funeralId=v; touch(); render(); }
function setItem(v){ const r=rec(); r.itemId=v;
  const it=DATA.ITEM(v); if(it&&it.fmt) r.label.fmt=it.fmt; touch(); render(); }
function setQty(v){ rec().qty=+v; touch(); render(); }
function setFmt(v){ rec().label.fmt=v; touch(); render(); }
function setKind(v){ const L=rec().label; L.kind=v; L.adj={}; touch(); render(); }
function setLead(v){ rec().label.lead=v; touch(); render(); }
function setRel(v){ const L=rec().label; L.withRel=v; L.adj={}; touch(); render(); }
function setPer(v){ rec().label.perRow=v; touch(); render(); }
function setQuick(i,v){ rec().label.names[i].na=v; touch(); render(); }
function setCouple(i,v){ const n=rec().label.names[i]; n.couple=v;
  if(v) n.na=(n.na||'').replace(/\s+/g,''); touch(); render(); }
function setN(i,k,v){ rec().label.names[i][k]=v; touch(); refresh(); }
function setC(i,k,v,re){ rec().label.corps[i][k]=v; touch(); re?render():refresh(); }
function setNote(v){ rec().note=v; }
function addN(){ const L=rec().label; if(L.names.length>=MAX_NAMES) return;
  L.names.push({na:'',rel:'',couple:false}); touch(); render();
  const e=$('#na'+(L.names.length-1)); if(e) e.focus(); }
function rmN(){ const L=rec().label; if(L.names.length>1){L.names.pop(); L.adj={}; touch(); render();} }
function addC(){ const L=rec().label; if(L.corps.length>=MAX_CORPS) return;
  L.corps.push({type:'株式会社',co:'',ti:'',na:''}); touch(); render(); }
function rmC(){ const L=rec().label; if(L.corps.length>1){L.corps.pop(); L.adj={}; touch(); render();} }
function setAdj(k,v){
  const L=rec().label; L.adj=L.adj||{}; L.adj[k]=+v; touch();
  const box=$('#fudabox'); if(box) box.innerHTML=FUDA.html(L,300,{area:true});
  const mt=$('#metrics'); if(mt) mt.innerHTML=metricsHtml(L);
  const mm=fieldMM(L);
  document.querySelectorAll('[data-mm]').forEach(e=>{
    e.textContent=(mm[e.dataset.mm]||0).toFixed(1)+'mm';});
  const el=document.querySelector(`[data-v="${k}"]`);
  if(el){ el.textContent=(+v>0?'+':'')+v; el.className='val'+(+v===0?' z':''); }
}
function resetAdj(){ rec().label.adj={}; touch(); render(); }
function saveDraft(){ const r=rec(); r.status='draft';
  flash('下書きとして保存しました。（モックなので画面を閉じると消えます）','alert-info'); }
function fixLabel(){ const r=rec(); r.status='fixed';
  flash('確定しました。出力の対象になります。','alert-success'); render(); }
function flash(msg,cls){
  const b=document.createElement('div'); b.className='alert '+cls;
  b.style.cssText='position:fixed;right:22px;bottom:22px;z-index:70;box-shadow:0 4px 16px rgba(0,0,0,.18)';
  b.textContent=msg; document.body.appendChild(b); setTimeout(()=>b.remove(),2600);
}

/* ---------- 外字（旧字・異体字）の選択 ---------- */
let GT=null;
function openGaiji(scope,idx,field){
  GT={scope,idx,field};
  const keys=Object.keys(GAIJI_TREE);
  $('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeGaiji()">
    <div class="box">
      <div class="card-header">字が出ないとき<span class="spacer"></span>
        <button class="btn btn-outline btn-sm" onclick="closeGaiji()">閉じる</button></div>
      <div class="card-body" style="padding-bottom:0">
        <p class="small muted" style="margin-top:0">よくある旧字・異体字です。押すと入力欄のうしろに足します。
          実機では MJ文字情報一覧表から字形を探し、見つからない字は外字として画像で差し込みます。</p>
      </div>
      ${keys.map(k=>`<div class="card-body" style="padding:8px 15px 0">
        <div class="cap small muted">「${k}」の仲間</div></div>
        ${GAIJI_TREE[k].map(x=>`<div class="gcand" onclick="pickGaiji(${arg(x.c)})">
          ${x.c?`<div class="gc">${esc(x.c)}</div>`:`<div class="gph">外字<br>画像</div>`}
          <div class="fn"><b>${esc(x.n)}</b><div class="small muted mono">${x.mj}</div></div>
          ${x.c?'<span class="badge b-success">そのまま出ます</span>'
               :'<span class="badge b-warning">外字（画像で差し込み）</span>'}
        </div>`).join('')}`).join('')}
      <div class="card-footer"><span class="small muted">
        選んだ字は入力欄に追加されます。不要な文字は手で消してください。</span></div>
    </div></div>`;
}
function closeGaiji(){ $('#modal').innerHTML=''; GT=null; }
function pickGaiji(ch){
  if(!ch){ flash('この字形は外字です。実機では画像で差し込みます。','alert-warn'); closeGaiji(); return; }
  const L=rec().label;
  if(GT.scope==='n') L.names[GT.idx][GT.field]=(L.names[GT.idx][GT.field]||'')+ch;
  else               L.corps[GT.idx][GT.field]=(L.corps[GT.idx][GT.field]||'')+ch;
  closeGaiji(); touch(); render();
}

/* ============================================================
   PDF 出力
   ============================================================ */
async function doPdf(){
  const items=LIST.filter(r=>S.sel.has(r.id)).flatMap(r=>{
    const f=fun(r.funeralId);
    return Array.from({length:r.qty},()=>({label:r.label,title:(f?f.name:'')+'_'+r.id}));
  });
  if(!items.length) return;
  const log=h=>{const e=$('#pdfLog'); if(e)e.innerHTML=h;};
  const b=$('#pdfBtn'); if(b)b.disabled=true;
  log(`<p class="small muted" style="margin-top:10px">作成しています…</p>`);
  try{
    const made=await FUDAPDF.exportByFormat(items,{prefix:'名札',
      onStep:(i,n,nm)=>log(`<p class="small muted" style="margin-top:10px">${nm}　${i} / ${n} 枚目を作成中…</p>`)});
    log(`<div class="alert alert-success" style="margin-top:12px">
      <b>${made.length}ファイルを書き出しました。</b><br>`+
      made.map(m=>`${esc(m.name)}　（${m.size}mm × ${m.count}枚）`).join('<br>')+`</div>`);
  }catch(e){
    log(`<div class="alert alert-danger" style="margin-top:12px">書き出せませんでした。${esc(e.message||e)}</div>`);
  }
  if(b)b.disabled=!S.sel.size;
}

/* 注文管理から #注文番号 で飛んできたとき */
const h0=decodeURIComponent(location.hash.replace(/^#/,''));
if(h0 && LIST.some(r=>r.id===h0)){ S.editId=h0; S.view='edit'; }
render();
